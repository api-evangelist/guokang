description: Guokang (国康私人医生 / Guokang Private Doctor, 深圳市国康健康管理服务有限公司)
  is a Shenzhen-based corporate and personal health-management service provider founded in 2005.
  It positions itself as one of China's leading health-management companies, integrating more than
  1,000 domestic and international medical resources — private physicians, specialist experts,
  tertiary hospitals, and health-examination centers — to deliver private doctor services,
  family medical-care programs, and corporate health services such as medical screening, employee
  assistance programs (EAP), group insurance, and on-site corporate health centers. Surfaced as a
  portfolio company of the Qiming venture network; no public developer portal or API surface was
  found during enrichment (the site is served behind a Huawei Cloud WAF).
